


<div class="list-section">
  <div class="list-header">
    <h3 class="list-title">STUDENTS</h3>
    
    
  </div>


  <div class="search-container">

    <input
        type="number"
        class="search-input"
        placeholder="Enter Student ID"
        [(ngModel)]="searchId">

    <button
        class="search-btn"
        (click)="searchStudent()">
        Search
    </button>

    <button
        class="show-btn"
        (click)="getStudents()">
        Show All
    </button>

</div>



  
  <div class="table-scroll">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Department</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
       @if (students().length > 0) {
  @for (s of students(); track s.id) {
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.username }}</td>
      <td>{{ s.email }}</td>
        <td>{{ s.department }}</td>
      <td>
        <div class="button-group">
          <button (click)="toggleFeeManager(s.id)" class="fee-btn">
                  {{ expandedStudentId() === s.id ? 'Hide Fee' : 'Manage Fee' }}
                </button>
          <button (click)="deleteStudent(s.id)" class="delete-btn">Delete</button>
        </div>
      </td>
    </tr>
    @if (expandedStudentId() === s.id) {
    <tr>
      <td colspan="5">
        <app-fee-manager [studentId]="s.id"></app-fee-manager>
      </td>
    </tr>
  }
  }
} @else {
  <tr>
    <td colspan="5" class="empty-row">No records found.</td>
  </tr>
}
    </tbody>


   
  </table>
  </div>
</div>
