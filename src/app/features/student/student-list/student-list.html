<div class="list-section">

  <p-toast></p-toast>

  <p-confirmDialog></p-confirmDialog>

  <div class="list-header">

    <h3 class="list-title">
      STUDENTS
    </h3>

  </div>

  <div class="search-container">

    <input
      pInputText
      type="text"
      class="search-input"
      placeholder="Enter Student email"
      [(ngModel)]="searchEmail"
    />

    <p-button
      label="Search"
      icon="pi pi-search"
      severity="success"
      [raised]="true"
      (onClick)="searchStudent()">
    </p-button>

    <p-button
      label="Show All"
      icon="pi pi-refresh"
      severity="secondary"
      [raised]="true"
      (onClick)="getStudents()">
    </p-button>

  </div>

  <div class="table-scroll">

    <p-table
      [value]="students()"
      styleClass="student-table"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">

        <tr>

          <th>ID</th>

          <th>Username</th>

          <th>Email</th>

          <th>Department</th>

          <th>Actions</th>

        </tr>

      </ng-template>
      <ng-template
        pTemplate="body"
        let-s
      >

        <tr>

          <td>
            {{ s.id }}
          </td>

          <td>
            {{ s.username }}
          </td>

          <td>
            {{ s.email }}
          </td>

          <td>
            {{ s.department }}
          </td>

          <td>

            <div class="button-group">

              <p-button
                [label]="
                  expandedStudentId() === s.id
                    ? 'Hide Fee'
                    : 'Manage Fee'
                "
                [icon]="
                  expandedStudentId() === s.id
                    ? 'pi pi-chevron-up'
                    : 'pi pi-wallet'
                "
                severity="info"
                [raised]="true"
                size="small"
                (onClick)="toggleFeeManager(s.id)">
              </p-button>

              <p-button
                icon="pi pi-trash"
                severity="danger"
                [raised]="true"
                size="small"
                ariaLabel="Delete student"
                (onClick)="deleteStudent(s.id)">
              </p-button>

            </div>

          </td>

        </tr>




        @if (expandedStudentId() === s.id) {

          <tr>

            <td colspan="5">

              <app-fee-manager
                [studentId]="s.id"
                [admissionYear]="s.admissionYear ?? 0">
              </app-fee-manager>

            </td>

          </tr>

        }

      </ng-template>



      <ng-template pTemplate="emptymessage">

        <tr>

          <td
            colspan="5"
            class="empty-row"
          >
            No records found.
          </td>

        </tr>

      </ng-template>

    </p-table>

  </div>

</div>
