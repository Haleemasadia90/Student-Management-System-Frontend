<div class="page-header">
  <h2>My Fee</h2>
</div>

@if (myFees().length > 0) {

  <div class="fee-list-wrapper">
    <div class="edit-profile-card fee-list-card">
      @for (fee of myFees(); track fee.id) {
        <div class="fee-item">
          <div class="fee-item-header">
            <span class="fee-semester">{{ fee.semester }}</span>
            <span class="fee-status" [class]="'status-' + fee.status.toLowerCase()">{{ fee.status }}</span>
          </div>
          <div class="fee-item-body">
            <p>Total: {{ fee.totalFee }}</p>
            <p>Paid: {{ fee.paidFee }}</p>
            <p>Due: {{ fee.dueAmount }}</p>
          </div>
        </div>
      }
    </div>
  </div>

} @else {
  <div class="fee-list-wrapper">
    <div class="edit-profile-card">
      <p class="empty-text">No fee records found.</p>
    </div>
  </div>
}
