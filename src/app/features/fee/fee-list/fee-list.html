<div class="list-section">

  <div class="list-header">
    <h3 class="list-title">FEE RECORDS</h3>
  </div>

  <div class="search-container">
  <input
    type="text"
    class="search-input"
    placeholder="Search by name..."
    [(ngModel)]="searchName"
    (ngModelChange)="onSearchChange($event)">
<!-- 
    <button class="show-btn" (click)="getStudents()">Show All</button> -->
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Student ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Department</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      @if (students().length > 0) {
        @for (s of students(); track s.id) {
          <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.username }}</td>
            <td>{{ s.email }}</td>
            <td>{{ s.department }}</td>
            <td>
              <button class="view-btn" (click)="viewFeeDetail(s.id)">View</button>
            </td>
          </tr>
        }
      } @else {
        <tr>
          <td colspan="5" class="empty-row">No students found.</td>
        </tr>
      }
    </tbody>
  </table>

</div>
