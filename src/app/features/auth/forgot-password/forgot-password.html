<div class="auth-page">
  <div class="auth-card">
    <h1>Forgot Password</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

    <form [formGroup]="form">

      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" formControlName="email" placeholder="Enter your registered email">
      </div>

      @if (successMessage()) {
        <small class="success">{{ successMessage() }}</small>
      }
      @if (errorMessage()) {
        <small class="error">{{ errorMessage() }}</small>
      }

      <button type="button" class="submit-btn" (click)="submit()">Send Reset Link</button>

      <p class="link-text">
        Remembered your password? <a routerLink="/login">Login</a>
      </p>
    </form>
  </div>
</div>
