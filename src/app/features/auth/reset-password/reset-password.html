<div class="login-container">
  <div class="login-card">
    <h1>Reset Password</h1>
    <form [formGroup]="form">
      <div class="form-group">
        <label>New Password</label>
        <input class="form-control" type="password" formControlName="newPassword">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input class="form-control" type="password" formControlName="confirmPassword">
      </div>

      @if (successMessage()) {
        <small class="success">{{ successMessage() }}</small>
      }
      @if (errorMessage()) {
        <small class="error">{{ errorMessage() }}</small>
      }

      <button type="button" class="login-btn" (click)="submit()">Reset Password</button>
    </form>
  </div>
</div>
