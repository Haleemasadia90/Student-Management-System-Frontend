<div class="dashboard-header">
  <h2>Welcome, {{ username }} </h2>
</div>

@if (myRecord()) {

  <div class="profile-upload-section">
    <img
      [src]="myRecord()?.profilePicture
        ? 'http://localhost:8080/uploads/profile-pictures/' + myRecord()?.profilePicture
        : 'assets/default-avatar.png'"
      class="profile-dp"
      alt="Profile Picture">

    <label class="upload-label">
      Change Photo
      <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
    </label>
  </div>

  <div class="dashboard-cards">

    <div class="dashboard-card">
      <div class="card-icon">🆔</div>
      <div>
        <p>Student ID</p>
        <h3>{{ myRecord()?.id }}</h3>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon">👤</div>
      <div>
        <p>Username</p>
        <h3>{{ myRecord()?.username }}</h3>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon">📧</div>
      <div>
        <p>Email</p>
        <h3 class="card-value-sm">{{ myRecord()?.email }}</h3>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-icon">🏛️</div>
      <div>
        <p>Department</p>
        <h3>{{ myRecord()?.department }}</h3>
      </div>
    </div>

  </div>
} @else {
  <p class="loading-text">Loading your record...</p>
}
