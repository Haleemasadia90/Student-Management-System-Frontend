<div class="dashboard-header">
    <h2>Welcome, {{username}} (Student)</h2>
    <button (click)="logout()" class="=logout-btn">Logout</button>
</div>

@if(myRecord())
{
    <div class="record-card">
        <p><strong>ID:</strong> {{myRecord()?.id}}</p>
        <p><strong>Username:</strong> {{myRecord()?.username}}</p>
        <p><strong>Email:</strong> {{myRecord()?.email}}</p>
    </div>
}
@else {
    <p>Loading your record...</p>
}
