<div class="modal-overlay">

    <div class="modal">

        <h2>Add Student</h2>

        <form>

            <div class="form-group">
                <label for="studentID">Student ID:</label>
                <input type="number" id="studentID" name="studentID" [(ngModel)]="newStudent.studentID" class="form-control" />
            </div>

            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname"  [(ngModel)]="newStudent.fname" class="form-control" />
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" [(ngModel)]="newStudent.email" class="form-control" />
            </div>

        

            <div class="button-group">
                <button type="button" (click)="saveStudent()" class="save-btn">Save</button>

                <button type="button" (click)="closeForm()" class="cancel-btn">Cancel</button>

            </div>

        </form>

    </div>

</div>
